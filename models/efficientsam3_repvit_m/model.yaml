        size_bytes: 506751
      - path: vocab.json
        uri: hf://models/openai/clip-vit-base-patch32@3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268/vocab.json
        sha256: 5047b556ce86ccaf6aa22b3ffccfc52d391ea4accdab9c2f2407da5b742d4363
        size_bytes: 862328
      - path: merges.txt
        uri: hf://models/openai/clip-vit-base-patch32@3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268/merges.txt
        sha256: f526393189112391ce6f9795d4695f704121ce452c3aad1f5335cc41337eba85
        size_bytes: 524657
components:
- id: text_encoder
  role: text_encoder
  source: &source
    type: file
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/yolo26n/1746e6f7199c3590ffb7b9f789aafda69bcae194a6f8458dbfa9ea6a7f6caf5a/38121683651-1/model.onnx
    sha256: 1746e6f7199c3590ffb7b9f789aafda69bcae194a6f8458dbfa9ea6a7f6caf5a
    size_bytes: 9917015
    media_type: application/onnx
  interface:
    format: onnx
    opset: 17
    entrypoints:
    - id: default
      inputs:
      - name: token_one_hot
        dtype: float32
        shape: [1, 16, 49408]
        layout: NLC
        description: One-hot CLIP BPE token IDs of the prompt, start and end tokens included; padding rows are zero.
      outputs:
      - name: text_features
        dtype: float32
        shape: [1, 16, 256]
        layout: NLC
        description: Feature of each token position.
    shape_profiles: []
  preprocessing:
    pipeline: []
  postprocessing:
    pipeline: []
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters: {}
  recipe: scripts/compile.py
- id: image_model
  role: detection_head
  source: *source
  interface:
    format: onnx
    opset: 17
    entrypoints:
    - id: default
      inputs:
      - name: pixel_values
        dtype: float32
        shape: [1, 3, 1008, 1008]
        layout: NCHW
        description: RGB image stretched to 1008x1008 and scaled to [-1, 1].
      - name: text
        dtype: float32
        shape: [1, 17, 256]
        layout: NLC
        description: Rows 0-15 hold the text features; row 16 holds 1 for each prompt token in its first 16 columns.
      outputs:
      - name: detections
        dtype: float32
        shape: [1, 200, 6]
        layout: NLC
        description: Per query x1, y1, x2, y2 in 1008x1008 input pixels, score, and 0.
      - name: mask_logits
        dtype: float32
        shape: [1, 200, 192, 192]
        layout: NCHW
        description: Mask logits of each query over the whole input; resize to the original image.
    shape_profiles: []
  preprocessing:
    pipeline:
    - op: decode_image
      parameters: {color_space: RGB}
    - op: resize
      parameters: {height: 1008, width: 1008, preserve_aspect_ratio: false, resample: bilinear}
    - op: rescale
      parameters: {factor: 0.00392156862745098}
    - op: normalize
      parameters:
        mean: [0.5, 0.5, 0.5]
        std: [0.5, 0.5, 0.5]
    - op: transpose
      parameters: {from: HWC, to: CHW}
  postprocessing:
    pipeline: []
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters: {}
  recipe: scripts/compile.py
  depends_on:
  - text_encoder
resources:
- id: tokenizer
  source:
    type: file_set
    entrypoint: vocab.json
    files:
    - path: vocab.json
      uri: hf://models/openai/clip-vit-base-patch32@3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268/vocab.json
      sha256: 5047b556ce86ccaf6aa22b3ffccfc52d391ea4accdab9c2f2407da5b742d4363
      size_bytes: 862328
