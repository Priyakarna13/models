    - path: merges.txt
      uri: hf://models/openai/clip-vit-base-patch32@3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268/merges.txt
      sha256: f526393189112391ce6f9795d4695f704121ce452c3aad1f5335cc41337eba85
      size_bytes: 524657
      media_type: text/plain
  install_path: resources/tokenizer
  license:
    spdx: MIT
    redistribution: allowed
    attribution: The CLIP BPE vocabulary is OpenAI's, released with the openai/CLIP repository under the MIT License.
