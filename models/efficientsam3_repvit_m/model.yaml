id: efficientsam3_repvit_m
display_name: EfficientSAM3 RepViT-M
description: Text-prompted EfficientSAM3 detector and segmenter with a RepViT-M image encoder.
model_type: vision
tasks:
- instance_segmentation
- object_detection
modalities:
  inputs:
  - image
  - text
  outputs:
  - bounding_boxes
  - masks
  - class_scores
architecture:
  id: efficientsam3
  variant: stage1_repvit_m1_1_1008x1008
owners:
- '@sima-neat/models'
license:
  spdx: Apache-2.0 AND LicenseRef-SAM-License
  redistribution: restricted
  attribution: EfficientSAM3 is published on Hugging Face by Simon7108528 under Apache-2.0. Its text encoder, fusion
    encoder, decoder, and heads are Meta's SAM 3 weights, distributed only under the SAM License.
