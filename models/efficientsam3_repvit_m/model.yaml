display_name: EfficientSAM3 RepViT-M
description: Text-prompted EfficientSAM3 detector and segmenter with a RepViT-M image encoder.
model_type: vision
tasks: [instance_segmentation, object_detection]

modalities:
  inputs: [image, text]
  outputs: [bounding_boxes, masks, class_scores]

architecture: efficientsam3

# The model card declares Apache-2.0 for the distilled RepViT encoder. The text encoder, fusion encoder, decoder and
# heads are Meta's SAM 3 weights and the neck is fine-tuned from SAM 3's, so the package as a whole is distributed
# under the SAM License (the LICENSE in the pinned sam3 0.1.4 wheel), which requires a copy of the agreement.
license:
  spdx: LicenseRef-SAM-License
  redistribution: restricted
  attribution: EfficientSAM3 is published on Hugging Face by Simon7108528; its RepViT image encoder is Apache-2.0. Its text encoder, fusion encoder, decoder and heads are Meta's SAM 3 weights, distributed under the SAM License. The CLIP BPE vocabulary is OpenAI's, under the MIT License.

upstream:
  repository: https://huggingface.co/Simon7108528/EfficientSAM3
  revision: 85b05896928f974e308f889d7ccb2eefc069de98
  derived_from: https://github.com/SimonZeng7108/efficientsam3/tree/bd0936c788fed8d51fa799437f05abd97b401b06

# Stage 1 supplies SAM 3's text encoder, fusion encoder, decoder and heads; the fine-tuned student (efficientsam3_ft)
# supplies the RepViT trunk and neck, which find about three times as many COCO objects from a text prompt as Stage 1's.
# Its MobileCLIP-S0 text encoder is not loaded. The sam3 wheel provides the model code without its dependencies:
# sam3 0.1.4 declares iopath>=0.1.10, which publishes no wheel, so convert.py unpacks only the package.
conversion:
  # The assembled upstream weights with the PyTorch model's outputs on four cases. surgery.py builds the graph to
  # compile from them and exports the ONNX, so compiler adaptations do not rerun the conversion.
  outputs: [weights.pth]
  source:
    repository: Simon7108528/EfficientSAM3
    revision: 85b05896928f974e308f889d7ccb2eefc069de98
    main_file: efficient_sam3_repvit_m.pt
    files:
      efficient_sam3_repvit_m.pt:
        uri: hf://models/Simon7108528/EfficientSAM3@85b05896928f974e308f889d7ccb2eefc069de98/stage1_all_converted/efficient_sam3_repvit_m.pt
        sha256: 2694a10ca7d4e470d7fd79b9c7fb0d97a902133fdb900615e1de5aff682704d0
        size_bytes: 1727097589
      efficientsam3_repvit.pt:
        uri: hf://models/Simon7108528/EfficientSAM3@85b05896928f974e308f889d7ccb2eefc069de98/efficientsam3_ft/efficientsam3_repvit.pt
        sha256: cf9dc34f7e7a4fd6967e21ce660d45f7d6512669556c02658eadf469bdae20ab
        size_bytes: 482292909
      sam3-0.1.4-py3-none-any.whl:
        uri: https://files.pythonhosted.org/packages/f3/73/16864549e382f23b9c0bc738b8bca5270770bbc88552e9fdaf9a95cee867/sam3-0.1.4-py3-none-any.whl
        sha256: dc2089fccbcd183896df8cf9b3bf53da9f6a23f17e49f5b643ade993322d2949
        size_bytes: 506751
      vocab.json:
        uri: hf://models/openai/clip-vit-base-patch32@3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268/vocab.json
        sha256: 5047b556ce86ccaf6aa22b3ffccfc52d391ea4accdab9c2f2407da5b742d4363
        size_bytes: 862328
      merges.txt:
        uri: hf://models/openai/clip-vit-base-patch32@3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268/merges.txt
        sha256: f526393189112391ce6f9795d4695f704121ce452c3aad1f5335cc41337eba85
        size_bytes: 524657

resources:
  tokenizer:
    source:
      repository: openai/clip-vit-base-patch32
      revision: 3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268
      files:
        vocab.json: {sha256: 5047b556ce86ccaf6aa22b3ffccfc52d391ea4accdab9c2f2407da5b742d4363, size_bytes: 862328}
        merges.txt: {sha256: f526393189112391ce6f9795d4695f704121ce452c3aad1f5335cc41337eba85, size_bytes: 524657}
    install_path: tokenizer
  sam_license:
    source:
      repository: facebook/sam3
      revision: 3c879f39826c281e95690f02c7821c4de09afae7
      files:
        LICENSE: {sha256: bec48f70bd37bf8280a9d1ebf01642d26086f6122ba735baa08fe03c5a6e7448, size_bytes: 7352}
    install_path: licenses/sam3
  clip_license:
    source:
      repository: cubert-gmbh/clip
      revision: a223b3db0b7bd1b55cf8f6421629b30b46c995de
      files:
        LICENSE: {sha256: 987e63b32f6c89ff5160e429458a872ff048e6860b590a3912e938f9da8f14db, size_bytes: 1064}
    install_path: licenses/clip

compilation:
  format: onnx
  source: conversion
  components: [text_encoder, image_model]

calibrations:
- id: coco-2017-cal
  dataset: {id: coco-2017, variant: cal, sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1, size_bytes: 187510866}

# On-demand because Spot runners lost this ~4 h compile three times mid-run, at the default size because its
# measured peak (21.4 GiB) fits the default runner.
build_profiles:
  # The image model calibrates on the quantized text encoder's features, as the board runs them.
  w16a16:
    calibration_dataset: coco-2017-cal
    runner_market: on-demand
    components:
      text_encoder:
        parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 16}
      image_model:
        parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 16}

pipeline:
- {component: text_encoder}
- {cpu: Pack text features and token mask}
- {component: image_model}

numerical_fidelity:
  # Query reassignment can lower numerical similarity for equivalent detections.
  status: diagnostic
  dataset: {id: coco-2017, variant: cal, sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1, size_bytes: 187510866}
  selection: {method: seeded_random_without_replacement, seed: 0, offset: 16, samples: 4}
  outputs: [detections, mask_logits]

# Published SAM 3 and EfficientSAM3 scores use other protocols, such as box-prompted mask mIoU, so no reference score
# is declared. accuracy.py prompts each of the 100 lowest-ID val2017 images with all 80 category names.
accuracy:
  datasets:
  - {id: coco-2017, variant: val, sha256: a40de1caf42b47c5a8976eb97efe3c83f3a41337c4d16d318eb15d65c293f2da, size_bytes: 898368520}

performance: {}
