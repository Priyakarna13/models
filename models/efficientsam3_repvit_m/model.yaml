compositions:
- id: default
  type: declarative
  components:
  - {id: text_encoder, component: text_encoder, entrypoint: default}
  - {id: image_model, component: image_model, entrypoint: default}
  connections: []
  inputs:
  - name: token_one_hot
    to: {component: text_encoder, input: token_one_hot}
  - name: pixel_values
    to: {component: image_model, input: pixel_values}
  - name: text
    to: {component: image_model, input: text}
  outputs:
  - name: text_features
    from: {component: text_encoder, output: text_features}
  - name: detections
    from: {component: image_model, output: detections}
  - name: mask_logits
    from: {component: image_model, output: mask_logits}
packages:
