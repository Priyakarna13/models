display_name: DINOv3 ViT-S+/16
description: Embeds an image as one vector and a 14×14 grid of patch vectors for image search and dense tasks.
model_type: vision
tasks: [image_embedding]

modalities:
  inputs: [image]
  outputs: [embeddings]

architecture: dino

license:
  spdx: LicenseRef-DINOv3
  redistribution: restricted
  attribution: Derived from Meta's facebook/dinov3-vits16plus-pretrain-lvd1689m and distributed under the DINOv3 License, which governs every build derived from it.

upstream:
  repository: https://huggingface.co/timm/vit_small_plus_patch16_dinov3.lvd1689m
  revision: c35074f0e1a65242948168c9358ce26705c4deb2
  derived_from: https://huggingface.co/facebook/dinov3-vits16plus-pretrain-lvd1689m/tree/c93d816fc9e567563bc068f01475bec89cc634a6

conversion:
  source:
    repository: timm/vit_small_plus_patch16_dinov3.lvd1689m
    revision: c35074f0e1a65242948168c9358ce26705c4deb2
    main_file: model.safetensors
    files:
      model.safetensors: {sha256: 423e7b4b1103de4100a5c19a436cc00f1a994d82835ed51623b209ccfd1e9615, size_bytes: 114750056}
      config.json: {sha256: 003e19711e5e10ab5a4a1082fdb2669db286e3888bad4372fcf1029a68d40dcc, size_bytes: 675}
      LICENSE.md: {sha256: 25d122eb8f5b880fd23c736fb6ea8018ee45c12237e00b8a86d14c653904999e, size_bytes: 7503}

compilation:
  format: onnx
  source: conversion

calibrations:
- id: imagenet-2012-cal
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}

# AFE calibrates every precision. BF16 activations take no ranges from it, so w16a16 calibrates on 4 seeded
# imagenet-2012 cal images; w8a16's SmoothQuant moves activation outliers into the weights and measures them on 32.
build_profiles:
  w16a16:
    calibration_dataset: imagenet-2012-cal
    components:
      model:
        parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 4}

  w8a16:
    calibration_dataset: imagenet-2012-cal
    components:
      model:
        parameters: {precision: w8a16, calibration_bins: 2048, calibration_samples: 32}

  # w8a8 is held back: calibrated on 50 imagenet-2012 cal images, ViT-S+/16's outputs keep no fidelity to the ONNX
  # (cosine similarity 0.03 for class_embedding and 0.20 for patch_embeddings; w8a16: 0.995 and 0.997).

numerical_fidelity:
  status: diagnostic
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}
  # The 50 images after the first 50, so they stay apart from any calibration set.
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 50, samples: 50}
  outputs: [class_embedding, patch_embeddings]

performance: {}

reference_metrics:
- source: https://huggingface.co/timm/vit_small_plus_patch16_dinov3.lvd1689m/blob/c35074f0e1a65242948168c9358ce26705c4deb2/README.md
  dataset: {id: imagenet-real, split: val}
  conditions: 512x512 center crop, linear classifier on the frozen CLS token, trained on ImageNet-1k train
  note: >-
    Top-1 against the ReaL labels of the ImageNet validation images, not the original labels of the registry's
    imagenet-2012 val. The card refers to the DINOv3 paper (arXiv 2508.10104v1, Table 14 and appendix D.7) for the
    protocol; Meta's linear classifier is not part of these weights.
  metrics: {top1_accuracy: 0.88}
- source: https://huggingface.co/timm/vit_small_plus_patch16_dinov3.lvd1689m/blob/c35074f0e1a65242948168c9358ce26705c4deb2/README.md
  dataset: {id: imagenet-r, split: test}
  conditions: 512x512 center crop, linear classifier on the frozen CLS token, trained on ImageNet-1k train
  note: ImageNet-Rendition.
  metrics: {top1_accuracy: 0.688}
- source: https://huggingface.co/timm/vit_small_plus_patch16_dinov3.lvd1689m/blob/c35074f0e1a65242948168c9358ce26705c4deb2/README.md
  dataset: {id: objectnet, split: test}
  conditions: 512x512 center crop, linear classifier on the frozen CLS token, trained on ImageNet-1k train
  metrics: {top1_accuracy: 0.546}
