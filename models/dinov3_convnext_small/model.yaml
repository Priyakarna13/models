display_name: DINOv3 ConvNeXt Small
description: Embeds an image as one vector and a 7×7 grid of patch vectors for image search and dense tasks.
model_type: vision
tasks: [image_embedding]

modalities:
  inputs: [image]
  outputs: [embeddings]

architecture: convnext

license:
  spdx: LicenseRef-DINOv3
  redistribution: restricted
  attribution: Derived from Meta's facebook/dinov3-convnext-small-pretrain-lvd1689m and distributed under the DINOv3 License, which governs every build derived from it.

upstream:
  repository: https://huggingface.co/timm/convnext_small.dinov3_lvd1689m
  revision: 9a0c319ae4531d36df6ef11fc253fdc4b503628a
  derived_from: https://huggingface.co/facebook/dinov3-convnext-small-pretrain-lvd1689m/tree/421020015aa4266363db803b6049a529999afb1e

conversion:
  source:
    repository: timm/convnext_small.dinov3_lvd1689m
    revision: 9a0c319ae4531d36df6ef11fc253fdc4b503628a
    main_file: model.safetensors
    files:
      model.safetensors: {sha256: d6888643d396f63c881f8658418609d6f8b98cc37653ee074b3b6769e4059ef5, size_bytes: 197852680}
      config.json: {sha256: a6891ae7041108d1bebdb0d5c98b0d085ed28c7df275df5cdf5e90d8bfc6d3cd, size_bytes: 595}
      LICENSE.md: {sha256: 25d122eb8f5b880fd23c736fb6ea8018ee45c12237e00b8a86d14c653904999e, size_bytes: 7503}

compilation:
  format: onnx
  source: conversion

calibrations:
- id: imagenet-2012-cal
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}

# AFE calibrates every precision. BF16 activations take no ranges from it, so w16a16 calibrates on 4 seeded
# imagenet-2012 cal images; w8a16's SmoothQuant moves activation outliers into the weights and measures them on 32.
build_profiles:
  w16a16:
    calibration_dataset: imagenet-2012-cal
    components:
      model:
        parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 4}

  w8a16:
    calibration_dataset: imagenet-2012-cal
    components:
      model:
        parameters: {precision: w8a16, calibration_bins: 2048, calibration_samples: 32}

  # w8a8 is held back, as for DINOv3 ConvNeXt Tiny, whose INT8-activation outputs keep no fidelity to the ONNX
  # (cosine similarity 0.32 for class_embedding and 0.30 for patch_embeddings).

numerical_fidelity:
  status: diagnostic
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}
  # The 50 images after the first 50, so they stay apart from any calibration set.
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 50, samples: 50}
  outputs: [class_embedding, patch_embeddings]

performance: {}

# timm's ConvNeXt model cards print no scores; the DINOv3 paper's Table 15 does, at 256x256 and 512x512.
reference_metrics:
- source: https://arxiv.org/html/2508.10104v1
  dataset: {id: imagenet-real, split: val}
  conditions: 256x256 center crop, linear classifier on the frozen pooled embedding, trained on ImageNet-1k train
  note: >-
    Top-1 against the ReaL labels of the ImageNet validation images, not the original labels of the registry's
    imagenet-2012 val. Appendix D.7 of the paper gives the protocol; Meta's linear classifier is not part of
    these weights.
  metrics: {top1_accuracy: 0.879}
- source: https://arxiv.org/html/2508.10104v1
  dataset: {id: imagenet-r, split: test}
  conditions: 256x256 center crop, linear classifier on the frozen pooled embedding, trained on ImageNet-1k train
  note: >-
    ImageNet-Rendition. Table 15 prints the same IN-R and ObjectNet scores for ConvNeXt Tiny and Small.
  metrics: {top1_accuracy: 0.737}
- source: https://arxiv.org/html/2508.10104v1
  dataset: {id: objectnet, split: test}
  conditions: 256x256 center crop, linear classifier on the frozen pooled embedding, trained on ImageNet-1k train
  metrics: {top1_accuracy: 0.526}
