# A build profile of this model compiles for over 20 minutes, so it builds only on request.
build-on-demand: true
display_name: RF-DETR Seg Nano
description: The smallest RF-DETR transformer instance segmenter for COCO objects.
model_type: vision
tasks: [instance_segmentation]

modalities:
  inputs: [image]
  outputs: [bounding_boxes, class_scores, masks]

architecture: rf_detr_seg

license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: RF-DETR Seg Nano is distributed by Roboflow under Apache-2.0.

upstream:
  repository: https://huggingface.co/Roboflow/rf-detr-seg-nano
  revision: 472badbc863609789ce1f69311244c670bdfd2b9

conversion:
  source:
    repository: Roboflow/rf-detr-seg-nano
    revision: 472badbc863609789ce1f69311244c670bdfd2b9
    main_file: model.safetensors
    files:
      model.safetensors: {sha256: 769bf8c0d180f3a4d0dc7fedfbfe561023d1b00754e669b6aac16d713b8c4050, size_bytes: 134376252}
      config.json: {sha256: b35addc90a2c9e919c2f381d777024315e3ba203df8f11ec76bcab4e70aa85ce, size_bytes: 5778}
      preprocessor_config.json: {sha256: 3482ec4d8f229bcbcc49a9f8483d731bb691cd6907bacbaffd8123ca20877e46, size_bytes: 442}

compilation:
  format: onnx
  source: conversion
  components: [backbone, decoder, mask_head]

calibrations:
- id: coco-2017-cal
  dataset: {id: coco-2017, variant: cal, sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1, size_bytes: 187510866}

# On-demand because Spot runners repeatedly lost RF-DETR compiles mid-run (sima-neat/vulcan#298).
build_profiles:
  w8a16_w16a16:
    # The most accurate build: 0.402 COCO mask AP at 62.4 FPS on a DevKit, against the FP32 ONNX's 0.404.
    # The decoder calibrates on this backbone's outputs; W8A16 skips backbone calibration.
    calibration_dataset: coco-2017-cal
    runner_market: on-demand
    components:
      backbone:
        parameters: {precision: w8a16, per_token: true}
      # Sin/Cos use INT8 lookup tables even at BF16, so the decoder needs calibrated ranges.
      decoder:
        parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 50}
      mask_head:
        parameters: {precision: w16a16}

  w8a16_w16a16_w8a8:
    # The fastest build: an INT8 mask head cuts its four 78x78 blocks from 6.8 ms to 2.1 ms of MLA time, for
    # 88.6 FPS and 0.398 COCO mask AP on a DevKit.
    calibration_dataset: coco-2017-cal
    runner_market: on-demand
    components:
      backbone:
        parameters: {precision: w8a16, per_token: true}
      # Sin/Cos use INT8 lookup tables even at BF16, so the decoder needs calibrated ranges.
      decoder:
        parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 50}
      # The mask head calibrates on this build's quantized backbone features and decoder queries.
      mask_head:
        parameters: {precision: w8a8, calibration_bins: 2048, calibration_samples: 50}

  # No w8a16: with the mask head inside the decoder, Model Compiler 3.0.0.1 (sima-mlc 3.0.0.dev0+master.194) failed
  # a W8A16 decoder in its large-tensor support with "Overlap in L1 detected" at MLA_0/conv2d_add_54, with and
  # without per_token; w8a16_w16a16_w8a8 lowers the mask head's precision instead. compile.py keeps its recipe.
  # w8a16:
  #   calibration_dataset: coco-2017-cal
  #   runner_market: on-demand
  #   components:
  #     backbone:
  #       parameters: {precision: w8a16, per_token: true}
  #     decoder:
  #       parameters: {precision: w8a16, calibration_bins: 2048, calibration_samples: 50}
  #     mask_head:
  #       parameters: {precision: w16a16}

  # No w8a8_w16a16: before the mask head became its own component, it ran at 77.5 FPS on a DevKit against
  # w8a16_w16a16's 62.8, but scored 0.357 COCO mask AP, 11.8% below the FP32 ONNX's 0.404. compile.py keeps its recipe.
  # w8a8_w16a16:
  #   calibration_dataset: coco-2017-cal
  #   runner_market: on-demand
  #   components:
  #     backbone:
  #       parameters: {precision: w8a8, calibration_bins: 1024, calibration_samples: 50}
  #     decoder:
  #       parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 50}
  #     mask_head:
  #       parameters: {precision: w16a16}

  # No w8a8_mixed_w16a16: before the mask head became its own component, RF-DETR Nano's BF16 regions ran at 61.7 FPS
  # and scored 0.395 COCO mask AP on a DevKit, slower and less accurate than w8a16_w16a16. compile.py keeps its recipe.
  # w8a8_mixed_w16a16:
  #   calibration_dataset: coco-2017-cal
  #   runner_market: on-demand
  #   components:
  #     backbone:
  #       parameters:
  #         precision: w8a8
  #         calibration_bins: 1024
  #         calibration_samples: 50
  #         bf16_regions: [residual, attention_global, projector, head, outputs]
  #     decoder:
  #       parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 50}
  #     mask_head:
  #       parameters: {precision: w16a16}

pipeline:
- {component: backbone}
- {cpu: Top 100 proposals}
- {component: decoder}
- {component: mask_head}

numerical_fidelity:
  # Reordered queries can lower numerical similarity for equivalent detections.
  status: diagnostic
  dataset: {id: coco-2017, variant: cal, sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1, size_bytes: 187510866}
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 50, samples: 10}
  outputs: [dets, labels, masks]

accuracy:
  datasets:
  - {id: coco-2017, variant: val, sha256: a40de1caf42b47c5a8976eb97efe3c83f3a41337c4d16d318eb15d65c293f2da, size_bytes: 898368520}

performance: {}

reference_metrics:
- source: https://github.com/roboflow/rf-detr/blob/a459eeade6387927c599a50f287a319a19d7ae82/README.md
  dataset: {id: coco-2017, split: val}
  conditions: 312x312
  metrics: {coco_mask_map: 0.403, coco_mask_ap50: 0.630}
- origin: fp32_baseline
  script: scripts/fp32_baseline_accuracy.py
  dataset: {id: coco-2017, split: val}
  conditions: FP32 ONNX on ONNX Runtime CPU; the image stretched to 312x312; the 100 best query/class pairs, masks resized bilinearly to the image and thresholded at zero; all 5000 val2017 images
  metrics: {coco_mask_map: 0.404, coco_mask_ap50: 0.6329, coco_mask_ap75: 0.4252, coco_box_map: 0.4929, coco_box_ap50: 0.6816}
