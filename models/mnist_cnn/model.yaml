display_name: MNIST CNN
description: Classifies a handwritten digit in a 28x28 grayscale image as 0 to 9 with a small convolutional network.
model_type: vision
tasks: [handwriting_classification]

modalities:
  inputs: [image]
  outputs: [class_scores]

architecture: lenet

# The model's README in the ONNX Model Zoo carries SPDX MIT; its Hugging Face card lists Apache-2.0. Both permit
# redistribution; the model's own SPDX line is recorded.
license:
  spdx: MIT
  redistribution: allowed
  attribution: MNIST-12 from the ONNX Model Zoo, trained in CNTK by Microsoft, distributed under MIT.

upstream:
  repository: https://huggingface.co/onnxmodelzoo/mnist-12
  revision: 1cd752f4a3d818fa215aa621c78b8a10a4a1a3a5
  derived_from: https://github.com/Microsoft/CNTK/blob/master/Tutorials/CNTK_103D_MNIST_ConvolutionalNeuralNetwork.ipynb

compilation:
  format: onnx
  source:
    uri: hf://models/onnxmodelzoo/mnist-12@1cd752f4a3d818fa215aa621c78b8a10a4a1a3a5/mnist-12.onnx
    sha256: 5c688690f8bacf667d4c2074af5ad0646ca328d7ab03eccf944a65b320171bdd
    size_bytes: 26143

# The MNIST IDX files: 60,000 training digits (calibration) and the 10,000 test digits (accuracy).
calibrations:
- id: mnist-default
  dataset: {id: mnist, variant: default, sha256: 9f362a9b0c6b9237ca379a2f9cd541b0f71b06d0b31a8134e7845fa43ef88eca, size_bytes: 11595829}

build_profiles:
  # BF16 compiles (one MLA segment) and scores 0.9892, but on Modalix DevKits its MPK intermittently stops in its MLA
  # stage ("A pipeline stage stopped while processing data"), in accuracy, performance and Core's own benchmark alike.
  # Bisection points at the BF16 compile of the second 5x5 convolution (8 to 16 channels); INT8 runs reliably. It is
  # left out until it runs reliably.
  # w16a16:
  #   components:
  #     model:
  #       parameters:
  #         precision: w16a16
  #         input_name: Input3
  #         input_shape: [1, 1, 28, 28]

  # INT8 scores 0.9888 on the 10,000 test digits on a DevKit, within 0.04% of BF16's 0.9892.
  w8a8:
    calibration_dataset: mnist-default
    components:
      model:
        parameters:
          precision: w8a8
          input_name: Input3
          input_shape: [1, 1, 28, 28]
          calibration_samples: 500

accuracy:
  datasets:
  - {id: mnist, variant: default, sha256: 9f362a9b0c6b9237ca379a2f9cd541b0f71b06d0b31a8134e7845fa43ef88eca, size_bytes: 11595829}

performance: {}

reference_metrics:
- source: https://huggingface.co/onnxmodelzoo/mnist-12/blob/1cd752f4a3d818fa215aa621c78b8a10a4a1a3a5/README.md
  dataset: {id: mnist, split: test}
  conditions: 28x28 grayscale scaled to 0-1, FP32
  note: The model card's TOP-1 ERROR of 1.1% for MNIST-12.
  metrics: {top1_accuracy: 0.989}
