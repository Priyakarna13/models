display_name: SSD-MobileNet V3 Large

description: An SSDLite COCO detector built on MobileNet V3 Large.

model_type: vision

tasks:
  - object_detection

model_family: ssd_mobilenet

license:
  spdx: BSD-3-Clause
  customer_redistribution: prohibited
  attribution: Exported from TorchVision SSDLite320-MobileNetV3 Large COCO_V1 weights; TorchVision is distributed
    under BSD-3-Clause.

upstream:
  repository: https://github.com/pytorch/vision
  revision: v0.18.1
  model_card: https://pytorch.org/vision/0.18/models/generated/torchvision.models.detection.ssdlite320_mobilenet_v3_large.html
  derived_from: https://download.pytorch.org/models/ssdlite320_mobilenet_v3_large_coco-a79551df.pth

compilation:
  format: onnx
  source:
    type: file
    uri: https://api.github.com/repos/sima-neat/models/releases/assets/502158604
    sha256: 5655500a6f5046b60c3e90b24d18d9c67977a732abeeccdbacadf9dfbce3ac5a
    size_bytes: 15784877
    media_type: application/x-gtar
  components:
    - model

datasets:
  default:
    source:
      type: file
      uri: https://api.github.com/repos/sima-neat/models/releases/assets/500803386
      sha256: e412f8ed3d7ff8238eface1337c46bdf874180d85b7d68dcbe2508222e7ba98f
      size_bytes: 55112720
      media_type: application/x-npz

build_profiles:
  w8a8:
    calibration_dataset: default
    components:
      model:
        parameters:
          precision: w8a8
          quantization_method: qat
          activation_quantization: asymmetric_per_tensor_8bit
          weight_quantization: symmetric_per_channel_8bit
          calibration_method: min_max
          calibration_samples: 128
          requantization: sima
          quantization_quality_thresholds:
            minimum_cosine_similarity: 0.98
            maximum_normalized_root_mean_square_error: 0.2
  w16a16:
    calibration_dataset: default
    components:
      model:
        parameters:
          precision: w16a16
          quantization_method: ptq
          activation_quantization: bfloat16
          weight_quantization: bfloat16
          calibration_method: mse
          calibration_samples: 128
          requantization: sima
          quantization_quality_thresholds:
            minimum_cosine_similarity: 0.999
            maximum_normalized_root_mean_square_error: 0.05

performance:
  required_metrics:
    - model.latency.avg
    - model.inference_rate

reference_metrics:
  - source: https://github.com/pytorch/vision/blob/126fc22ce33e6c2426edcf9ed540810c178fe9ce/torchvision/models/detection/ssdlite.py
    dataset:
      id: coco-2017
      split: val
    conditions: 320x320, torchvision COCO_V1 weights
    metrics:
      coco_map: 0.213
