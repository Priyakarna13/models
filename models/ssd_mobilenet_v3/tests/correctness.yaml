schema_version: 1
status: pending_hardware_qualification
reference: onnx_fp32_raw_heads
dataset: coco_val2017
calibration_samples: 128
validation_samples: 32
split: category_balanced_and_disjoint
metrics:
  - raw_head_cosine_similarity
  - decoded_detection_recall_at_0_5_iou
  - decoded_detection_mean_matched_iou
qualification_policy: Record all held-out raw-head measurements and reject malformed, non-finite, or zero-energy outputs.
note: Numeric thresholds, decoded accuracy, and performance remain pending first Vulcan measurements and Modalix hardware qualification.
