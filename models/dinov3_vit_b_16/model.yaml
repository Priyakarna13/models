display_name: DINOv3 ViT-B/16
description: Embeds an image as one vector and a 14×14 grid of patch vectors for image search and dense tasks.
model_type: vision
tasks: [image_embedding]

modalities:
  inputs: [image]
  outputs: [embeddings]

architecture: dino

license:
  spdx: LicenseRef-DINOv3
  redistribution: restricted
  attribution: Derived from Meta's facebook/dinov3-vitb16-pretrain-lvd1689m and distributed under the DINOv3 License, which governs every build derived from it.

upstream:
  repository: https://huggingface.co/onnx-community/dinov3-vitb16-pretrain-lvd1689m-ONNX
  revision: d704d636f7b114347fd2a9d6fecac5e1ef464db3
  derived_from: https://huggingface.co/facebook/dinov3-vitb16-pretrain-lvd1689m/tree/5931719e67bbdb9737e363e781fb0c67687896bc

conversion:
  source:
    repository: onnx-community/dinov3-vitb16-pretrain-lvd1689m-ONNX
    revision: d704d636f7b114347fd2a9d6fecac5e1ef464db3
    main_file: onnx/model.onnx
    files:
      onnx/model.onnx: {sha256: 0d68aa8f33d21a5616a468239dbe80608abe53619a2663f05e269785eaceb746, size_bytes: 138170}
      onnx/model.onnx_data: {sha256: 6f292af27497d258257d256bf5eee4151edb67d92f586196beaa182767060353, size_bytes: 342564864}
      config.json: {sha256: 6e377b24e5764abb284951a1bef8067c5c062c40963912b08d461f7c113a6b76, size_bytes: 836}
      preprocessor_config.json: {sha256: 960c41d1f3a7778b936365769a2d90550b318a6c0a53a0296957adacfe5e0dd7, size_bytes: 585}

compilation:
  format: onnx
  source: conversion

calibrations:
- id: imagenet-2012-cal
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}

# AFE calibrates every precision. BF16 activations take no ranges from it, so w16a16 and w8a16 calibrate on the first
# 4 seeded imagenet-2012 cal images; w8a8 sets its INT8 activation ranges on the first 50.
build_profiles:
  w16a16:
    calibration_dataset: imagenet-2012-cal
    components:
      model:
        parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 4}

  w8a16:
    calibration_dataset: imagenet-2012-cal
    components:
      model:
        parameters: {precision: w8a16, calibration_bins: 2048, calibration_samples: 4}

  w8a8:
    calibration_dataset: imagenet-2012-cal
    components:
      model:
        parameters: {precision: w8a8, calibration_bins: 2048, calibration_samples: 50}

numerical_fidelity:
  status: diagnostic
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}
  # The 50 images after the 50 that w8a8 calibrates on.
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 50, samples: 50}
  outputs: [class_embedding, patch_embeddings]

performance: {}
